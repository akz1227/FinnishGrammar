/* ===== VERBS ===== */
{g:'Verbs',id:'vt',t:'Verb types & present tense',fi:'Verbityypit',u:'https://uusikielemme.fi/finish-grammar/the-finnish-verbtypes/',h:`
<p>Finnish verbs are sorted into <b>6 types</b> by the ending of the dictionary form (the 1st infinitive). The type tells you how to build every form. Present tense = <b>verb stem + personal ending</b>.</p>
<h3>1. Personal endings</h3>
<div class=tw><table><tr><th>Person</th><th>Ending</th><th>Example (puhua)</th></tr><tr><td>minä</td><td>-n</td><td>puhun <i>I speak</i></td></tr><tr><td>sinä</td><td>-t</td><td>puhut</td></tr><tr><td>hän</td><td>lengthen the last vowel</td><td>puhuu</td></tr><tr><td>me</td><td>-mme</td><td>puhumme</td></tr><tr><td>te</td><td>-tte</td><td>puhutte</td></tr><tr><td>he</td><td>-vat / -vät</td><td>puhuvat</td></tr></table></div>
<h3>2. The six types</h3>
<div class=tw><table><tr><th>Type</th><th>Infinitive ends</th><th>Stem rule</th><th>minä / hän</th></tr>
<tr><td>1</td><td>-a/-ä (after a vowel)</td><td>drop the last vowel (gradation possible)</td><td>puhun / puhuu · luen / lukee · annan / antaa</td></tr>
<tr><td>2</td><td>-da/-dä</td><td>drop -da/-dä</td><td>juon / juo · syön / syö · teen / tekee</td></tr>
<tr><td>3</td><td>-la/-na/-ra/-sta (+ä)</td><td>drop -la… add <b>e</b></td><td>tulen / tulee · menen / menee · olen / on · nousen / nousee</td></tr>
<tr><td>4</td><td>-ta/-tä (after a vowel)</td><td>drop -ta, add <b>a/ä</b></td><td>haluan / haluaa · tapaan / tapaa · pelaan / pelaa</td></tr>
<tr><td>5</td><td>-ita/-itä</td><td>-ta → <b>-tse</b></td><td>tarvitsen / tarvitsee</td></tr>
<tr><td>6</td><td>-eta/-etä</td><td>-ta → <b>-ne</b></td><td>vanhenen / vanhenee</td></tr></table></div>
<h3>3. Details to watch</h3>
<ul><li><b>Consonant gradation</b> in types 1, 3, 4 and 6: strong grade in the infinitive and 3rd person, weak grade in minä/sinä/me/te: tapaan, tapaat but <b>tapaa</b>; lukea → luen, lukee; tehdä → teen, <b>tekee</b>.</li>
<li><b>Type 3</b> 3rd person adds the vowel twice: tulee, menee, opiskelee.</li>
<li><b>Type 4</b>: haluta → haluan, haluat, haluaa, haluamme, haluatte, haluavat.</li>
<li>Irregular but very common: <b>olla</b> → olen, olet, on, olemme, olette, ovat.</li></ul>
<h3>4. Negation</h3>
<p>Negative verb <b>en, et, ei, emme, ette, eivät</b> + the bare verb stem (no personal ending, weak grade): <i>Minä en puhu suomea. Hän ei tule. Me emme halua.</i></p>
<div class=warn><b>Common mistakes:</b> ✗ <i>hän tulle</i> → ✓ <b>tulee</b>. ✗ <i>minä tapaan → hän tapaan</i>. Remember that sinä/hän/he differ in gradation for type 4 and 1.</div>`,
q:['Minä ___ (puhua) suomea.|puhun|I speak Finnish.','Sinä ___ (juoda) kahvia.|juot|You drink coffee.','Hän ___ (tulla) kotiin.|tulee|He/She comes home.','Me ___ (mennä) kauppaan.|menemme|We go to the shop.','Minä ___ (haluta) teetä.|haluan|I want tea.','Te ___ (opiskella) suomea.|opiskelette|You (pl.) study Finnish.','He ___ (pelata) jalkapalloa.|pelaavat|They play football.','Minä ___ (tarvita) apua.|tarvitsen|I need help.','Hän ___ (syödä) leipää.|syö|He/She eats bread.','Minä ___ (lukea) kirjaa.|luen|I’m reading a book.','Me ___ (tavata) ystäviä.|tapaamme|We meet friends.','Minä en ___ (puhua) ruotsia.|puhu|I don’t speak Swedish.']},
{g:'Verbs',id:'past',t:'Past tense (imperfect)',fi:'Imperfekti',u:'https://uusikielemme.fi/finnish-grammar/the-imperfect-tense-past-tense-imperfekti/',h:`
<p>The imperfect is the everyday past tense: <i>I spoke, I was, I went</i>. It is built from the verb stem + <b>-i-</b>, then the normal personal endings.</p>
<h3>1. Endings</h3>
<div class=tw><table><tr><th>Person</th><th>Present</th><th>Past (puhua)</th></tr><tr><td>minä</td><td>puhun</td><td>puhuin</td></tr><tr><td>sinä</td><td>puhut</td><td>puhuit</td></tr><tr><td>hän</td><td>puhuu</td><td>puhui</td></tr><tr><td>me</td><td>puhumme</td><td>puhuimme</td></tr><tr><td>te</td><td>puhutte</td><td>puhuitte</td></tr><tr><td>he</td><td>puhuvat</td><td>puhuivat</td></tr></table></div>
<h3>2. By verb type</h3>
<ul><li><b>Type 1</b>: drop the final vowel and add -i; a long final vowel (-aa/-ää) turns into -i. puhua → puhui · asua → asui · ostaa → <b>osti</b> · lukea → <b>luin</b> (k disappears) · ottaa → otin · antaa → <b>annoin</b>, antoi · sanoa → sanoin.</li>
<li><b>Type 2</b>: drop -da/-dä, add -i. juoda → <b>join</b> · syödä → <b>söin</b> · käydä → kävin · tehdä → <b>tein</b>.</li>
<li><b>Type 3</b>: stem + i. tulla → <b>tulin</b> · mennä → <b>menin</b> · olla → <b>olin</b> · opiskella → opiskelin.</li>
<li><b>Type 4</b>: -t- → -s-. haluta → <b>halusin</b> · tavata → <b>tapasin</b> · pelata → pelasin.</li>
<li><b>Type 5</b>: tarvita → <b>tarvitsin</b>. <b>Type 6</b>: vanheta → <b>vanhenin</b>.</li>
<li>Irregular: nähdä → <b>näin, näit, näki</b>; lähteä → lähdin; tietää → tiesi.</li></ul>
<h3>3. Negative past</h3>
<p>Negative verb + past participle <b>-nut/-nyt</b> (plural <b>-neet</b>): <i>En puhunut. Et tullut. Hän ei ollut kotona. Emme menneet. He eivät syöneet.</i></p>
<h3>4. Time words</h3><p>eilen (yesterday), viime viikolla (last week), viime vuonna (last year), kaksi päivää sitten (two days ago).</p>
<div class=warn><b>Common mistakes:</b> ✗ <i>minä tulleen</i> → ✓ <b>tulin</b>. ✗ <i>en puhui</i> → ✓ <b>en puhunut</b> (negative past never uses -i-).</div>`,
q:['Eilen minä ___ (puhua) suomea.|puhuin|Yesterday I spoke Finnish.','Sinä ___ (asua) Helsingissä.|asuit|You lived in Helsinki.','Hän ___ (tulla) kotiin.|tuli|He/She came home.','Me ___ (mennä) kouluun.|menimme|We went to school.','Minä ___ (juoda) kahvia.|join|I drank coffee.','He ___ (syödä) pizzaa.|söivät|They ate pizza.','Minä ___ (haluta) kahvia.|halusin|I wanted coffee.','Sinä ___ (ostaa) leipää.|ostit|You bought bread.','Me ___ (olla) kotona.|olimme|We were at home.','Hän ___ (nähdä) elokuvan.|näki|He/She saw a movie.','Te ___ (tavata) ystävän.|tapasitte|You (pl.) met a friend.','Minä en ___ (puhua) suomea eilen.|puhunut|I didn’t speak Finnish yesterday.']},
{g:'Verbs',id:'perf',t:'Perfect tense',fi:'Perfekti',u:'https://uusikielemme.fi/finnish-grammar/the-perfect-tense-perfekti/',h:`
<p>The perfect is formed like in English: <b>olla (present) + past participle</b>. <i>Olen asunut</i> = I have lived.</p>
<h3>1. Forming the participle (-nut / -nyt)</h3>
<div class=tw><table><tr><th>Type</th><th>Infinitive</th><th>Participle</th></tr>
<tr><td>1</td><td>puhua · asua · lukea</td><td>puhunut · asunut · lukenut</td></tr>
<tr><td>2</td><td>juoda · syödä · tehdä</td><td>juonut · syönyt · tehnyt</td></tr>
<tr><td>3</td><td>tulla · mennä · olla · nousta</td><td>tullut · mennyt · ollut · noussut (n assimilates to the stem consonant)</td></tr>
<tr><td>4</td><td>haluta · tavata</td><td>halunnut · tavannut</td></tr>
<tr><td>5 / 6</td><td>tarvita · vanheta</td><td>tarvinnut · vanhennut</td></tr></table></div>
<p>Plural: <b>-neet</b> (puhuneet, tulleet, menneet, syöneet). Back vowel words use -nut, front vowel words -nyt (syönyt, nähnyt).</p>
<h3>2. Sentences</h3>
<ul><li>Positive: <i>Olen asunut täällä kaksi vuotta.</i> Hän <b>on tullut</b>. Me <b>olemme menneet</b>.</li>
<li>Negative: <i>En ole nähnyt sitä elokuvaa.</i> (en/et/ei… + ole + participle)</li>
<li>Question: <i>Oletko jo syönyt?</i> <i>Have you already eaten?</i></li></ul>
<h3>3. When to use it</h3>
<ul><li><b>Result still relevant:</b> Olen unohtanut avaimeni. <i>(I’ve forgotten my keys.)</i></li>
<li><b>Experience:</b> Oletko käynyt Suomessa? <i>(Have you been to Finland?)</i></li>
<li><b>Situation continuing to now:</b> Olen asunut täällä vuoden. <i>(I’ve lived here for a year – still do.)</i></li></ul>
<p>Use the imperfect for a finished time in the past (<i>Asuin täällä vuoden</i> = I lived here for a year, no longer).</p>
<div class=warn><b>Common mistakes:</b> ✗ <i>olen mennyt eilen</i> → with a definite past time use the imperfect: ✓ <b>menin eilen</b>.</div>`,
q:['Minä olen ___ (asua) täällä kaksi vuotta.|asunut|I have lived here for two years.','Hän on ___ (tulla) kotiin.|tullut|He/She has come home.','Me olemme ___ (mennä) kauppaan.|menneet|We have gone to the shop.','Oletko sinä jo ___ (syödä)?|syönyt|Have you already eaten?','Olen ___ (olla) Helsingissä monta kertaa.|ollut|I have been in Helsinki many times.','He ovat ___ (haluta) matkustaa.|halunneet|They have wanted to travel.','Minä en ole ___ (nähdä) sitä elokuvaa.|nähnyt|I haven’t seen that movie.','Olemme ___ (opiskella) suomea vuoden.|opiskelleet|We have studied Finnish for a year.','Oletteko te ___ (tavata)?|tavanneet|Have you (pl.) met?','Hän on ___ (juoda) kahvia.|juonut|He/She has drunk coffee.','Minä olen ___ (puhua) hänen kanssaan.|puhunut|I have talked with him/her.','Sinä et ole ___ (lukea) tätä kirjaa.|lukenut|You haven’t read this book.']},
{g:'Verbs',id:'imp',t:'Imperative',fi:'Imperatiivi',u:'https://uusikielemme.fi/finnish-grammar/the-imperative-mood-imperatiivi-tule-mene-syo/',h:`
<p>The imperative gives commands, invitations and instructions. Finnish has a singular (<b>sinä</b>) and a plural/polite (<b>te</b>) form.</p>
<h3>1. Singular (sinä)</h3>
<p>Take the <b>minä form</b> of the present tense and drop the <b>-n</b>.</p>
<div class=tw><table><tr><th>Infinitive</th><th>minä</th><th>Imperative</th></tr><tr><td>tulla</td><td>tulen</td><td><b>tule!</b> <i>come</i></td></tr><tr><td>mennä</td><td>menen</td><td><b>mene!</b> <i>go</i></td></tr><tr><td>syödä</td><td>syön</td><td><b>syö!</b> <i>eat</i></td></tr><tr><td>ottaa</td><td>otan</td><td><b>ota!</b> <i>take</i></td></tr><tr><td>antaa</td><td>annan</td><td><b>anna!</b> <i>give</i></td></tr><tr><td>avata</td><td>avaan</td><td><b>avaa!</b> <i>open</i></td></tr><tr><td>lukea</td><td>luen</td><td><b>lue!</b> <i>read</i></td></tr></table></div>
<h3>2. Plural / polite (te)</h3>
<p>Infinitive stem (strong grade) + <b>-kaa / -kää</b>: puhua → <b>puhukaa</b>, tulla → <b>tulkaa</b>, mennä → <b>menkää</b>, syödä → <b>syökää</b>, ottaa → <b>ottakaa</b>, lukea → <b>lukekaa</b>, antaa → <b>antakaa</b>.</p>
<h3>3. Negative imperative</h3>
<ul><li>Singular: <b>älä</b> + bare stem: <i>Älä mene! Älä odota! Älä puhu!</i></li>
<li>Plural: <b>älkää</b> + stem + <b>-ko/-kö</b>: <i>Älkää menkö! Älkää puhuko!</i></li></ul>
<h3>4. Softening</h3>
<p>Add <b>-pa/-pä</b>, <i>ole hyvä</i>, or <i>voisitko…</i> (could you…): <i>Tulepa tänne! Voisitko avata oven?</i></p>
<div class=warn><b>Common mistakes:</b> ✗ <i>tulekaa</i> → ✓ <b>tulkaa</b>. ✗ <i>älä menet</i> → ✓ <b>älä mene</b>.</div>`,
q:['___ tänne! (tulla)|Tule|Come here! (to one person)','___ kirja pöydältä! (ottaa)|Ota|Take the book from the table!','___ suomea! (puhua, te)|Puhukaa|Speak Finnish! (to several people)','___ ovi! (avata)|Avaa|Open the door!','Älä ___! (mennä)|mene|Don’t go!','___ kahvia! (juoda)|Juo|Drink some coffee!','___ tänne! (tulla, te)|Tulkaa|Come here! (to several people)','___ leipää! (syödä, te)|Syökää|Eat some bread! (several people)','Älä ___! (odottaa)|odota|Don’t wait!','Älkää ___! (mennä)|menkö|Don’t go! (several people)','___ minulle kahvia! (antaa)|Anna|Give me some coffee!','___ tämä teksti! (lukea, te)|Lukekaa|Read this text! (several people)']},
/* ===== NOUNS ===== */
{g:'Nouns & cases',id:'part',t:'Partitive (singular)',fi:'Partitiivi',u:'https://uusikielemme.fi/finnish-grammar/finnish-cases/grammatical-cases/the-partitive-case-partitiivi',h:`
<p>The partitive expresses <b>“some of / part of”</b>. It is one of the most important Finnish cases: it marks unfinished, uncountable, negated or counted-from-two things.</p>
<h3>1. Forming the singular partitive</h3>
<ul><li>Words ending in a vowel: add <b>-a/-ä</b>. talo → <b>taloa</b>, koulu → <b>koulua</b>, kirja → <b>kirjaa</b>, kala → <b>kalaa</b>, leipä → <b>leipää</b>, auto → <b>autoa</b>.</li>
<li>Loan words in -i: kahvi → <b>kahvia</b>, bussi → <b>bussia</b>, banaani → banaania.</li>
<li>Native e-stems in -i take <b>-ta/-tä</b> or change to e: ovi → <b>ovea</b>, lehti → <b>lehteä</b>, kieli → <b>kieltä</b>, vesi → <b>vettä</b>, lapsi → <b>lasta</b>, käsi → <b>kättä</b>, mies → <b>miestä</b>.</li>
<li>Words in -nen: nainen → <b>naista</b>, suomalainen → suomalaista.</li>
<li>Consonant gradation is <i>not</i> usually applied (open syllable): kauppa → kauppaa, lukea → lukea.</li></ul>
<div class=tw><table><tr><th>Pronoun</th><th>Partitive</th></tr><tr><td>minä, sinä, hän</td><td>minua, sinua, häntä</td></tr><tr><td>me, te, he</td><td>meitä, teitä, heitä</td></tr></table></div>
<h3>2. When to use it</h3>
<ol><li><b>Uncountable / mass nouns:</b> Juon vettä. Syön leipää. <i>I drink water / eat bread.</i></li>
<li><b>Negative sentences:</b> En syö lihaa. Hän ei osta autoa.</li>
<li><b>After numbers 2+:</b> kaksi kahvia, kolme lasta, viisi euroa.</li>
<li><b>Ongoing / unfinished actions:</b> Luen kirjaa. <i>I’m reading a book (not finished).</i></li>
<li><b>Emotion and certain verbs:</b> rakastaa (rakastan sinua), odottaa (odotan bussia), pelätä, auttaa, kysyä, tarvita (tarvitsen apua).</li>
<li><b>After quantity words:</b> paljon vettä, vähän aikaa, pala kakkua, kuppi kahvia.</li></ol>
<div class=warn><b>Common mistakes:</b> ✗ <i>Haluan kaksi kahvi</i> → ✓ <b>kaksi kahvia</b>. ✗ <i>En syö liha</i> → ✓ <b>en syö lihaa</b>. ✗ <i>Rakastan sinut</i> → ✓ <b>rakastan sinua</b>.</div>`,
q:['Minä juon ___ (kahvi).|kahvia|I drink coffee.','Syön ___ (leipä).|leipää|I eat bread.','Hän ostaa ___ (maito).|maitoa|He/She buys milk.','En syö ___ (liha).|lihaa|I don’t eat meat.','Haluan kaksi ___ (kahvi).|kahvia|I want two coffees.','Minä rakastan ___ (sinä).|sinua|I love you.','Luen ___ (kirja).|kirjaa|I’m reading a book.','Juomme ___ (vesi).|vettä|We drink water.','Hän ei osta ___ (auto).|autoa|He/She doesn’t buy a car.','Meillä on kolme ___ (lapsi).|lasta|We have three children.','Syön ___ (kala).|kalaa|I eat fish.','Odotan ___ (bussi).|bussia|I’m waiting for the bus.']},
{g:'Nouns & cases',id:'gen',t:'Genitive',fi:'Genetiivi',u:'https://uusikielemme.fi/finnish-grammar/finnish-cases/grammatical-cases/the-genitive-case-genetiivi',h:`
<p>The genitive shows <b>possession</b> (“of”, “’s”). Its ending is <b>-n</b>, added to the stem. It also forms the base for most other cases, so it is worth learning well.</p>
<h3>1. Forming it</h3>
<ul><li>Vowel-ending words: add -n. talo → <b>talon</b>, kirja → <b>kirjan</b>, kahvi → <b>kahvin</b>, Maria → <b>Marian</b>, Suomi → <b>Suomen</b>.</li>
<li>-nen → -sen: nainen → <b>naisen</b>, suomalainen → suomalaisen.</li>
<li>-i with e-stem: lapsi → <b>lapsen</b>, vesi → <b>veden</b>, kieli → <b>kielen</b>, käsi → <b>käden</b>, ovi → <b>oven</b>.</li>
<li>Consonant gradation applies: kauppa → <b>kaupan</b>, kaupunki → <b>kaupungin</b>, tyttö → <b>tytön</b>, katu → <b>kadun</b>.</li>
<li>Words in a consonant: mies → <b>miehen</b>, kysymys → kysymyksen.</li></ul>
<div class=tw><table><tr><th>Pronoun</th><th>Genitive</th></tr><tr><td>minä, sinä, hän</td><td>minun, sinun, hänen</td></tr><tr><td>me, te, he</td><td>meidän, teidän, heidän</td></tr></table></div>
<h3>2. Use</h3>
<ul><li><b>The owner comes before the owned:</b> Marian kirja <i>(Maria’s book)</i>, lapsen lelu <i>(the child’s toy)</i>, minun autoni <i>(my car)</i>.</li>
<li><b>Total object:</b> Ostan kirjan. <i>(I buy the book.)</i></li>
<li><b>Before postpositions:</b> talon edessä <i>(in front of the house)</i>, pöydän alla <i>(under the table)</i>, minun kanssani <i>(with me)</i>.</li>
<li><b>Necessity subject:</b> Minun täytyy mennä. <i>(I have to go.)</i></li></ul>
<div class=warn><b>Common mistakes:</b> ✗ <i>kirja Marian</i> → ✓ <b>Marian kirja</b>. ✗ <i>lapsin lelu</i> → ✓ <b>lapsen lelu</b>.</div>`,
q:['Tämä on ___ (Maria) kirja.|Marian|This is Maria’s book.','___ (minä) auto on punainen.|Minun|My car is red.','Tämä on ___ (lapsi) lelu.|lapsen|This is the child’s toy.','Missä on ___ (ystävä) koti?|ystävän|Where is the friend’s home?','Tämä on ___ (nainen) laukku.|naisen|This is the woman’s bag.','___ (opettaja) nimi on Liisa.|Opettajan|The teacher’s name is Liisa.','___ (me) koti on Jyväskylässä.|Meidän|Our home is in Jyväskylä.','___ (hän) veli asuu Turussa.|Hänen|His/Her brother lives in Turku.','___ (Suomi) pääkaupunki on Helsinki.|Suomen|Finland’s capital is Helsinki.','Tämä on ___ (kaupunki) keskusta.|kaupungin|This is the city’s centre.','___ (kissa) ruoka on pöydällä.|Kissan|The cat’s food is on the table.','___ (he) talo on iso.|Heidän|Their house is big.']},
{g:'Nouns & cases',id:'int',t:'Inside location cases',fi:'Sisäpaikallissijat',u:'https://uusikielemme.fi/finnish-grammar/location-cases/missa-mista-mihin-location-cases/',h:`
<p>Three cases answer <b>missä?</b> (where?), <b>mistä?</b> (from where?) and <b>mihin?</b> (to where?) for places seen as an <b>enclosed space</b>: in a house, out of a city, into a school.</p>
<div class=tw><table><tr><th>Case</th><th>Question</th><th>Meaning</th><th>Ending</th><th>talo</th></tr><tr><td>Inessive</td><td>missä?</td><td>in</td><td>-ssa / -ssä</td><td>talossa</td></tr><tr><td>Elative</td><td>mistä?</td><td>out of, from</td><td>-sta / -stä</td><td>talosta</td></tr><tr><td>Illative</td><td>mihin?</td><td>into</td><td>-Vn / -hVn / -seen</td><td>taloon</td></tr></table></div>
<h3>1. Inessive and elative</h3>
<p>Add the ending to the <b>genitive stem</b> (weak grade): kauppa → kaupassa, kaupasta · kaupunki → kaupungissa, kaupungista · kuppi → kupissa · Helsinki → Helsingissä · Suomi → Suomessa, Suomesta · työ → työssä, työstä.</p>
<h3>2. Illative (the hard one)</h3>
<ul><li>Stem ending in a short vowel: <b>repeat the vowel + n</b>, with <b>strong grade</b>: talo → <b>taloon</b>, koulu → <b>kouluun</b>, kauppa → <b>kauppaan</b>, kaupunki → <b>kaupunkiin</b>, laukku → <b>laukkuun</b>.</li>
<li>Long vowel or one-syllable words: <b>-hVn</b>: maa → <b>maahan</b>, työ → <b>työhön</b>, suo → suohon.</li>
<li>-e / -nen / -s words: <b>-seen</b>: huone → <b>huoneeseen</b>, nainen → <b>naiseen</b>, kaunis → kauniiseen.</li>
<li>-i words: ovi → <b>oveen</b>, Suomi → <b>Suomeen</b>, Helsinki → <b>Helsinkiin</b>, kahvi → kahviin.</li></ul>
<h3>3. Typical verbs</h3>
<ul><li>missä: olla, asua, työskennellä, opiskella: Asun Helsingissä. Opiskelen yliopistossa.</li>
<li>mistä: tulla, lähteä, ottaa: Tulen kaupasta. Otan avaimen laukusta.</li>
<li>mihin: mennä, tulla, laittaa: Menen kouluun. Laitan kirjan laukkuun.</li></ul>
<div class=warn><b>Common mistakes:</b> ✗ <i>menen koulussa</i> → ✓ <b>menen kouluun</b> (movement = illative). ✗ <i>kaupungiin</i> → ✓ <b>kaupunkiin</b> (strong grade).</div>`,
q:['Asun ___ (Helsinki).|Helsingissä|I live in Helsinki.','Olen ___ (koulu).|koulussa|I am at school.','Menen ___ (koulu).|kouluun|I go to school.','Tulen ___ (kauppa).|kaupasta|I come from the shop.','Menemme ___ (kauppa).|kauppaan|We go to the shop.','Hän on ___ (kaupunki).|kaupungissa|He/She is in the city.','Kahvi on ___ (kuppi).|kupissa|The coffee is in the cup.','Otan avaimen ___ (laukku).|laukusta|I take the key out of the bag.','Laitan kirjan ___ (laukku).|laukkuun|I put the book into the bag.','He asuvat ___ (Suomi).|Suomessa|They live in Finland.','Opiskelen ___ (yliopisto).|yliopistossa|I study at the university.','Pekka tulee ___ (työ).|työstä|Pekka comes from work.']},
{g:'Nouns & cases',id:'ext',t:'Outside location cases',fi:'Ulkopaikallissijat',u:'https://uusikielemme.fi/finish-grammar/the-adessive-case-milla/',h:`
<p>Three cases answer <b>millä? miltä? mille?</b> for <b>surfaces, open areas, events and people</b>: on the table, at the market, from Anna, to my mother.</p>
<div class=tw><table><tr><th>Case</th><th>Question</th><th>Meaning</th><th>Ending</th><th>pöytä</th></tr><tr><td>Adessive</td><td>millä?</td><td>on, at; with (tool); have</td><td>-lla / -llä</td><td>pöydällä</td></tr><tr><td>Ablative</td><td>miltä?</td><td>from (off)</td><td>-lta / -ltä</td><td>pöydältä</td></tr><tr><td>Allative</td><td>mille?</td><td>onto, to</td><td>-lle</td><td>pöydälle</td></tr></table></div>
<p>All three attach to the weak-grade genitive stem: pöytä → pöydän → pöydällä; tori → torilla; piha → pihalla; kynä → kynällä.</p>
<h3>1. Uses</h3>
<ul><li><b>Surfaces and open places:</b> torilla, pihalla, kadulla, rannalla, pöydällä.</li>
<li><b>Events and workplaces:</b> kurssilla (at a course), keikalla (at a gig), työpaikalla (at the workplace). Note that juhlissa (at a party) uses the inessive.</li>
<li><b>People (to/from/at):</b> Annan lahjan äidille. Saan viestin Annalta. Olen ystävällä.</li>
<li><b>Means / tools:</b> junalla (by train), kynällä (with a pen), autolla (by car).</li>
<li><b>Possession:</b> <b>Minulla on</b> kissa. <i>I have a cat.</i> Negative: Minulla <b>ei ole</b> kissaa.</li>
<li><b>Time:</b> illalla (in the evening), kesällä (in summer), viikolla (during the week), viikonloppuna uses the essive instead.</li></ul>
<div class=tw><table><tr><th>Pronoun</th><th>Adessive</th><th>Ablative</th><th>Allative</th></tr><tr><td>minä</td><td>minulla</td><td>minulta</td><td>minulle</td></tr><tr><td>sinä</td><td>sinulla</td><td>sinulta</td><td>sinulle</td></tr><tr><td>hän</td><td>hänellä</td><td>häneltä</td><td>hänelle</td></tr><tr><td>me/te/he</td><td>meillä/teillä/heillä</td><td>meiltä/teiltä/heiltä</td><td>meille/teille/heille</td></tr></table></div>
<div class=warn><b>Common mistakes:</b> ✗ <i>Minä on kissa</i> → ✓ <b>Minulla on kissa</b>. ✗ <i>pöytässä</i> → usually ✓ <b>pöydällä</b> (surface, not enclosed).</div>`,
q:['Kirja on ___ (pöytä).|pöydällä|The book is on the table.','Laitan kirjan ___ (pöytä).|pöydälle|I put the book on the table.','Otan kirjan ___ (pöytä).|pöydältä|I take the book from the table.','___ (minä) on kissa.|Minulla|I have a cat.','___ (sinä) on aikaa.|Sinulla|You have time.','Annan lahjan ___ (äiti).|äidille|I give a gift to mum.','Hän on ___ (tori).|torilla|He/She is at the market square.','Saan viestin ___ (Anna).|Annalta|I get a message from Anna.','Matkustan ___ (juna).|junalla|I travel by train.','___ (me) on iso koti.|Meillä|We have a big home.','Kirjoitan ___ (kynä).|kynällä|I write with a pen.','Lapset ovat ___ (piha).|pihalla|The children are in the yard.']},
{g:'Nouns & cases',id:'grad',t:'Consonant gradation',fi:'Astevaihtelu',u:'https://uusikielemme.fi/finnish-grammar/consonant-gradation/consonant-gradation-astevaihtelu-kpt-vaihtelu',h:`
<p>The consonants <b>k, p, t</b> (inside a word) exist in a <b>strong</b> and a <b>weak</b> grade. The weak grade appears when the syllable after the consonant becomes <b>closed</b> (ends in a consonant), for example before the genitive <b>-n</b>.</p>
<div class=tw><table><tr><th>Strong</th><th>Weak</th><th>Example</th></tr>
<tr><td>kk</td><td>k</td><td>kukka → kukan</td></tr><tr><td>pp</td><td>p</td><td>kauppa → kaupan</td></tr><tr><td>tt</td><td>t</td><td>matto → maton</td></tr>
<tr><td>k</td><td>– (disappears)</td><td>ruoka → ruoan · lukea → luen</td></tr>
<tr><td>p</td><td>v</td><td>leipä → leivän</td></tr><tr><td>t</td><td>d</td><td>katu → kadun · pöytä → pöydän</td></tr>
<tr><td>nk</td><td>ng</td><td>kenkä → kengän</td></tr><tr><td>mp</td><td>mm</td><td>kampa → kamman</td></tr>
<tr><td>nt</td><td>nn</td><td>ranta → rannan · antaa → annan</td></tr>
<tr><td>lt</td><td>ll</td><td>kulta → kullan</td></tr><tr><td>rt</td><td>rr</td><td>virta → virran</td></tr></table></div>
<h3>1. Where it appears</h3>
<ul><li><b>Nouns:</b> the nominative has the strong grade; genitive, inessive, adessive etc. use the weak grade (kauppa → kaupassa), while the illative and partitive use the strong grade (kauppaan, kauppaa).</li>
<li><b>Verbs:</b> minä/sinä/me/te forms are weak, hän/he strong (type 4: tapaan vs tapaa); the infinitive is strong.</li>
<li><b>Comparatives:</b> pitkä → pidempi, halpa → halvempi.</li></ul>
<h3>2. Exceptions</h3>
<ul><li>The clusters <b>st, sk, sp</b> never change: posti → <b>postin</b>, koski → kosken. Also <b>ht</b> weakens to <b>hd</b>: lehti → <b>lehden</b>, kahta → kahden.</li>
<li>Loan words often do not change: auto → auton, kisa → kisan.</li>
<li>Learn the gradation together with each new word.</li></ul>
<div class=warn><b>Common mistakes:</b> ✗ <i>kukkan</i> → ✓ <b>kukan</b>. ✗ <i>kaupaa</i> → ✓ <b>kauppaa</b> (the partitive keeps the strong grade because the syllable stays open).</div>`,
q:['Genitive of kukka: ___|kukan|of the flower','Genitive of katu: ___|kadun|of the street','Genitive of leipä: ___|leivän|of the bread','Genitive of kauppa: ___|kaupan|of the shop','Genitive of matto: ___|maton|of the rug','Genitive of kampa: ___|kamman|of the comb','Genitive of kenkä: ___|kengän|of the shoe','Genitive of ranta: ___|rannan|of the beach','Genitive of tyttö: ___|tytön|of the girl','Genitive of ruoka: ___|ruoan|of the food','Genitive of pöytä: ___|pöydän|of the table','Minä ___ (antaa) lahjan.|annan|I give a gift.']},
{g:'Nouns & cases',id:'plu',t:'Plural (nominative & partitive)',fi:'Monikko',u:'https://uusikielemme.fi/finnish-grammar/grammatical-cases/the-t-plural/',h:`
<p>Finnish has two basic plural forms you need at A2: the <b>nominative plural in -t</b> (the “T-plural”) and the <b>plural stem in -i-</b> used in all other cases.</p>
<h3>1. The T-plural (subject of the sentence)</h3>
<p>Take the weak-grade stem + <b>-t</b>: talo → <b>talot</b>, kirja → <b>kirjat</b>, kahvi → <b>kahvit</b>, kissa → <b>kissat</b>, kukka → <b>kukat</b>, katu → <b>kadut</b>, pöytä → <b>pöydät</b>, kenkä → <b>kengät</b>, leipä → <b>leivät</b>, tyttö → <b>tytöt</b>.</p>
<ul><li>-nen → -set: nainen → <b>naiset</b>, suomalainen → suomalaiset.</li>
<li>-i (e-stem) → -et: lapsi → <b>lapset</b>, vesi → <b>vedet</b>, kieli → <b>kielet</b>, käsi → <b>kädet</b>, ovi → <b>ovet</b>.</li>
<li>The T-plural is also the <b>total object</b> in the plural: Ostan kirjat. <i>(I buy the books.)</i></li></ul>
<h3>2. Plural stem in -i- (other cases)</h3>
<p>Drop the final vowel, add <b>-i-</b>, then the case ending: talo → <b>taloissa</b>, kouluissa, kaupoissa, kirjoissa (a → o), lapsissa, naisissa, pöydissä, laukuissa.</p>
<h3>3. Plural partitive</h3>
<p>Used for “some” plural things, after negation and with quantity words: Rakastan <b>kissoja</b>. En osta <b>kirjoja</b>. Siellä on paljon <b>kouluja</b>.</p>
<ul><li>Short vowel stems: stem + <b>-ja/-jä</b>: talo → <b>taloja</b>, koulu → <b>kouluja</b>, kahvi → kahveja, pöytä → <b>pöytiä</b>.</li>
<li>-a/-ä stems often change to -o/-ö/-i: kirja → <b>kirjoja</b>, kissa → <b>kissoja</b>, koira → <b>koiria</b>, lapsi → <b>lapsia</b>, nainen → <b>naisia</b>, tyttö → tyttöjä.</li></ul>
<div class=warn><b>Common mistakes:</b> ✗ <i>kirjat ovat laukkussa</i> → ✓ <b>laukuissa</b> if you mean several bags. ✗ <i>Rakastan kissat</i> → ✓ <b>kissoja</b>.</div>`,
q:['Plural of kirja: ___|kirjat|books','Plural of lapsi: ___|lapset|children','Plural of nainen: ___|naiset|women','Plural of katu: ___|kadut|streets','Plural of pöytä: ___|pöydät|tables','Tässä ovat ___ (kenkä).|kengät|Here are the shoes.','Näen ___ (talo).|taloja|I see (some) houses.','Rakastan ___ (kissa).|kissoja|I love cats.','En osta ___ (kirja).|kirjoja|I don’t buy books.','Tässä kaupungissa on paljon ___ (koulu).|kouluja|There are many schools in this city.','Kirjat ovat ___ (laukku).|laukuissa|The books are in the bags.','Lapset ovat ___ (koulu).|kouluissa|The children are in schools.']},
{g:'Nouns & cases',id:'cmp',t:'Comparative & superlative',fi:'Vertailu',u:'https://uusikielemme.fi/finnish-grammar/finnish-comparative-of-adjectives/',h:`
<p>Adjectives have a <b>comparative</b> (bigger) and a <b>superlative</b> (biggest). Both take case endings like any adjective.</p>
<h3>1. Comparative: -mpi</h3>
<p>Weak-grade stem + <b>-mpi</b>: nopea → <b>nopeampi</b>, vaikea → <b>vaikeampi</b>, pieni → <b>pienempi</b>, iso → <b>isompi</b>, helppo → <b>helpompi</b>, uusi → <b>uudempi</b>, vanha → <b>vanhempi</b>, nuori → <b>nuorempi</b>, pitkä → <b>pidempi</b>, halpa → <b>halvempi</b>, kallis → <b>kalliimpi</b>, kaunis → <b>kauniimpi</b>.</p>
<h3>2. Superlative: -in</h3>
<p>Same stem + <b>-in</b>: nopea → <b>nopein</b>, pieni → <b>pienin</b>, vanha → <b>vanhin</b>, nuori → <b>nuorin</b>, helppo → <b>helpoin</b>, pitkä → <b>pisin</b>, halpa → <b>halvin</b>, kallis → <b>kallein</b>, kaunis → <b>kaunein</b>, uusi → <b>uusin</b>.</p>
<h3>3. Irregular</h3>
<div class=tw><table><tr><th>Positive</th><th>Comparative</th><th>Superlative</th></tr><tr><td>hyvä <i>good</i></td><td>parempi</td><td>paras</td></tr><tr><td>iso / suuri <i>big</i></td><td>isompi / suurempi</td><td>isoin / suurin</td></tr><tr><td>pieni <i>small</i></td><td>pienempi</td><td>pienin</td></tr><tr><td>paljon <i>much</i></td><td>enemmän</td><td>eniten</td></tr></table></div>
<h3>4. “Than”</h3>
<ul><li><b>kuin</b> + same case: Tämä auto on nopeampi <b>kuin</b> tuo. Olen vanhempi kuin sinä.</li>
<li><b>Partitive</b> without kuin: Hän on <b>minua</b> vanhempi. Tämä on <b>sitä</b> parempi.</li></ul>
<h3>5. Superlative sentences</h3>
<p>Tämä on <b>paras</b> ravintola kaupungissa. Hän on luokan <b>nuorin</b>. Se on kaikista <b>helpoin</b>.</p>
<div class=warn><b>Common mistakes:</b> ✗ <i>enemmän nopea</i> → ✓ <b>nopeampi</b>. ✗ <i>hyvempi</i> → ✓ <b>parempi</b>.</div>`,
q:['Tämä auto on ___ (nopea) kuin tuo.|nopeampi|This car is faster than that one.','Tämä talo on ___ (vanha) kuin tuo.|vanhempi|This house is older than that one.','Tämä kirja on ___ (hyvä) kuin tuo.|parempi|This book is better than that one.','Kahvi on ___ (halpa) kuin tee.|halvempi|Coffee is cheaper than tea.','Hän on ___ (pitkä) kuin minä.|pidempi|He/She is taller than me.','Tämä tehtävä on kaikista ___ (helppo).|helpoin|This task is the easiest of all.','Hän on luokan ___ (nuori).|nuorin|He/She is the youngest in the class.','Tämä on ___ (hyvä) ravintola kaupungissa.|paras|This is the best restaurant in the city.','Minä olen ___ (nuori) kuin sinä.|nuorempi|I am younger than you.','Tämä kauppa on ___ (kallis) kaikista.|kallein|This shop is the most expensive of all.','Hän on minua ___ (vanha).|vanhempi|He/She is older than me.','Tämä on ___ (pitkä) silta Suomessa.|pisin|This is the longest bridge in Finland.']},

{g:'Sentence patterns',id:'nec',t:'Possession & necessity',fi:'Omistus ja välttämättömyys',u:'https://uusikielemme.fi/finnish-grammar/necessity-sentences-taytyy-pitaa-on-pakko/',h:`
<p>Finnish has no verb “to have”. Instead it says <b>“on me there is…”</b> and uses a special <b>necessity construction</b> where the subject is in the genitive.</p>
<h3>1. Possession</h3>
<ul><li>[owner in adessive] + <b>on</b> + [thing]: <b>Minulla on</b> kissa. <b>Hänellä on</b> kaksi lasta. <b>Meillä on</b> iso koti. <i>(I have a cat…)</i></li>
<li>Negative: <b>ei ole</b> + partitive thing: Minulla <b>ei ole</b> aikaa. Meillä ei ole autoa.</li>
<li>Question: <b>Onko</b> sinulla aikaa? <i>Do you have time?</i></li>
<li>Past: Minulla <b>oli</b> kissa. Minulla <b>ei ollut</b> aikaa.</li></ul>
<h3>2. Necessity: täytyy / pitää / on pakko</h3>
<p>The subject is in the <b>genitive</b>; the verb stays in the 3rd person singular and is followed by the <b>1st infinitive</b>.</p>
<div class=tw><table><tr><th>Pattern</th><th>Example</th></tr><tr><td>Genitive + täytyy + inf.</td><td>Minun <b>täytyy</b> mennä. <i>I have to go.</i></td></tr><tr><td>Genitive + pitää + inf.</td><td>Sinun <b>pitää</b> odottaa. <i>You have to wait.</i></td></tr><tr><td>Genitive + on pakko + inf.</td><td>Meidän <b>on pakko</b> lähteä. <i>We must leave.</i></td></tr><tr><td>Genitive + ei tarvitse + inf.</td><td>Sinun <b>ei tarvitse</b> tulla. <i>You don’t have to come.</i></td></tr></table></div>
<ul><li>Past: Minun <b>täytyi</b> työskennellä. Minun <b>piti</b> mennä lääkäriin. Minun <b>oli pakko</b> lähteä.</li>
<li>Pronouns: minun, sinun, hänen, meidän, teidän, heidän. Nouns: Pekan täytyy opiskella.</li>
<li>Avoid saying <i>ei täydy</i> or <i>ei pidä</i> for “don’t have to”: they mean “must not”. Use <b>ei tarvitse</b>.</li></ul>
<div class=warn><b>Common mistakes:</b> ✗ <i>Minä täytyy mennä</i> → ✓ <b>Minun täytyy mennä</b>. ✗ <i>Minulla on pitää</i>.</div>`,

{g:'Sentence patterns',id:'obj',t:'Object: total vs. partial',fi:'Objekti',u:'https://uusikielemme.fi/finnish-grammar/grammatical-cases/the-finnish-object-objekti/',h:`
<p>The object of a Finnish sentence is either <b>total</b> (the whole thing, finished) or <b>partial</b> (partitive: not whole, unfinished, uncountable, negated).</p>
<h3>1. Total object: genitive / nominative / accusative</h3>
<div class=tw><table><tr><th>Form</th><th>Used for</th><th>Example</th></tr>
<tr><td>Genitive -n</td><td>singular countable</td><td>Ostan <b>kirjan</b>. Avaan <b>oven</b>. Syön koko <b>omenan</b>.</td></tr>
<tr><td>Nominative plural -t</td><td>plural countable</td><td>Ostan <b>kirjat</b>. Ostimme uudet <b>kengät</b>.</td></tr>
<tr><td>Nominative</td><td>singular imperative; necessity</td><td><b>Osta</b> leipä! Minun täytyy ostaa <b>leipä</b>.</td></tr>
<tr><td>Accusative -t</td><td>personal pronouns</td><td>Näen <b>sinut</b>. Tapasin <b>hänet</b>.</td></tr></table></div>
<p>Accusative pronouns: minä → <b>minut</b>, sinä → <b>sinut</b>, hän → <b>hänet</b>, me → <b>meidät</b>, te → <b>teidät</b>, he → <b>heidät</b>. For <i>kuka</i> and <i>ken</i> the accusative is <b>kenet</b>.</p>
<h3>2. Partial object: partitive</h3>
<ul><li><b>Unfinished action:</b> Luen kirjaa. <i>(I’m reading a book.)</i> vs. Luin kirjan. <i>(I read the whole book.)</i></li>
<li><b>Uncountable / unspecified amount:</b> Kuulen musiikkia. Juon kahvia.</li>
<li><b>Negative sentences:</b> En osta autoa. En näe sinua.</li>
<li><b>Partitive verbs:</b> rakastaa (rakastan häntä), odottaa, auttaa, tarvita (tarvitsen apua), pelätä, ikävöidä.</li></ul>
<h3>3. Quick test</h3>
<p>Ask: is it a <b>complete, bounded action</b> on a <b>countable whole</b> object, in an affirmative sentence? Yes → total. Otherwise → partitive.</p>
<div class=warn><b>Common mistakes:</b> ✗ <i>Rakastan sinut</i> → ✓ <b>rakastan sinua</b> (emotion verb). ✗ <i>En osta auton</i> → ✓ <b>autoa</b> (negative = partitive).</div>`,

];
const $=s=>document.querySelector(s),app=$('#app'),esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
let S={},cur=0,run=null;
try{S=JSON.parse(localStorage.getItem('fiA2'))||{}}catch(e){}
const save=()=>{try{localStorage.setItem('fiA2',JSON.stringify(S))}catch(e){}};
const st=id=>S[id]||(S[id]={wrong:[],day:null,set:[],res:null,perfect:0});
const item=(l,k)=>{const p=l.q[k].split('|');return{q:p[0],a:p[1],m:p[2]}};
function build(l){const s=st(l.id);if(s.day===today()&&s.set.length)return;
 s.day=today();s.res=null;const set=s.wrong.slice(0,10),n=l.q.length,d=Math.floor(Date.now()/864e5);
 for(let i=0;set.length<10;i++){const k=(d*10+i)%n;if(!set.includes(k))set.push(k)}
 s.set=set;save()}
function home(){run=null;let h='<h1>🇫🇮 Finnish A2 Grammar</h1><p class=sub>'+L.length+' lessons. Read the theory, then complete your 10 daily exercises. You need 10/10; anything you miss returns in tomorrow’s set. Lessons follow the topics on <a href="https://uusikielemme.fi/finnish-grammar" target=_blank rel=noopener>Uusi kielemme</a>.</p>',g='';
 L.forEach((l,i)=>{if(l.g!==g){if(g)h+='</div>';g=l.g;h+='<h2>'+g+'</h2><div class=grid>'}
 const s=st(l.id),dn=s.res&&s.day===today();
 h+=`<button class=card onclick="open_(${i})"><b>${i+1}. ${l.t}</b><span>${l.fi}</span><small>${dn?(s.res.score==10?'✅ Today: 10/10':'⚠️ Today: '+s.res.score+'/10'):'⏳ Today: not done'}<br>${s.wrong.length} to review · ${s.perfect} perfect days</small></button>`});
 app.innerHTML=h+'</div>'}
function open_(i,tab){cur=i;run=null;tab=tab||'learn';const l=L[i];
 app.innerHTML=`<button class=back onclick="home()">← All lessons</button><h1>${i+1}. ${l.t} <small class=sub>· ${l.fi}</small></h1><div class=tabs><button class="${tab=='learn'?'on':''}" onclick="open_(${i},'learn')">📖 Learn</button><button class="${tab!='learn'?'on':''}" onclick="open_(${i},'practice')">✏️ Daily practice</button></div><div id=v></div>`;
 if(tab=='learn'){$('#v').innerHTML=l.h+`<p><button class="btn p" onclick="open_(${i},'practice')">Go to daily practice →</button></p><p class=sub>Further reading: <a href="${l.u}" target=_blank rel=noopener>Uusi kielemme</a></p>`;window.scrollTo(0,0)}else practice()}
function practice(){const l=L[cur];build(l);const s=st(l.id);
 if(s.res)return summary(s.res.score,s.res.ok,false);
 const r=s.set.filter(k=>s.wrong.includes(k)).length;
 $('#v').innerHTML=`<div class=box><b>Today’s set: 10 exercises</b><p>${r?r+' of them are review questions you missed before.':'Fresh questions for today.'} Type the missing word in the correct form. You can only move on once your answer is <b>100% right</b>; if you miss it, the correct answer is shown and you retype it. First-try misses come back tomorrow.</p><button class="btn p" onclick="start(false)">Start</button></div>`}
function start(redo){run={i:0,ok:[],redo,fb:false};ask()}
function ask(){const l=L[cur],s=st(l.id),it=item(l,s.set[run.i]);run.fb=false;
 $('#v').innerHTML=`<div class=bar><i style="width:${run.i*10}%"></i></div><small class=sub>Question ${run.i+1} of 10</small><div class=q>${esc(it.q)}</div><input id=ans autocomplete=off autocapitalize=off spellcheck=false placeholder="Type your answer"><div id=fb></div><button id=go class="btn p" onclick="act()">Check</button><button id=nx class="btn p" style="display:none" onclick="act()">Next</button>`;
 const a=$('#ans');a.focus();a.onkeydown=e=>{if(e.key=='Enter')act()}}
function act(){run.fb?next():check()}
function check(){const l=L[cur],s=st(l.id),it=item(l,s.set[run.i]),inp=$('#ans'),v=inp.value.trim();
 if(!v)return;const ok=v.toLowerCase()==it.a.toLowerCase();if(run.ok.length<=run.i)run.ok.push(ok);const first=run.ok[run.i];if(ok){run.fb=true;inp.disabled=true}else{inp.value='';inp.focus()}
 $('#fb').innerHTML=`<div class="fb ${ok?'y':'n'}"><b>${ok?(first?'✓ Correct!':'✓ Correct now — this one returns tomorrow.'):'✗ Not quite — you wrote “'+esc(v)+'”. Type the right answer to continue.'}</b><div>Right answer: <b>${esc(it.a)}</b><br>${esc(it.q.replace('___',it.a))}<br>🇬🇧 ${esc(it.m)}</div></div>`;
 if(ok){$('#go').style.display='none';const n=$('#nx');n.style.display='';n.textContent=run.i<9?'Next →':'Finish';n.focus()}else $('#go').textContent='Try again'}
function next(){run.i++;run.i<10?ask():finish()}
function finish(){const l=L[cur],s=st(l.id),score=run.ok.filter(Boolean).length;
 if(!run.redo){s.set.forEach((k,j)=>{const w=s.wrong.indexOf(k);if(run.ok[j]){if(w>-1)s.wrong.splice(w,1)}else if(w<0)s.wrong.push(k)});
  s.res={score,ok:run.ok};if(score==10)s.perfect++;save()}
 summary(score,run.ok,run.redo)}
function summary(score,ok,redo){const l=L[cur],s=st(l.id),miss=10-score;
 let h=`<div class=box><h3 style="margin-top:0">${score==10?'🎉 Perfect — 100%!':'Result: '+score+'/10'}</h3><p>${score==10?'Today’s lesson is complete.':'100% is required. The '+miss+' missed exercise'+(miss>1?'s':'')+(redo?' (extra practice does not change tomorrow’s list).':' will be added to tomorrow’s list.')}</p>`;
 s.set.forEach((k,j)=>{const it=item(l,k);h+=`<div class=r>${ok[j]?'✅':'❌'} ${esc(it.q.replace('___',it.a))}<small>🇬🇧 ${esc(it.m)}</small></div>`});
 h+=`<p><button class="btn" onclick="start(true)">Redo for extra practice</button> <button class="btn" onclick="open_(${cur},'learn')">Review lesson</button> <button class="btn" onclick="home()">All lessons</button></p></div>`;
 $('#v').innerHTML=h}
home();
</script></body></html>
